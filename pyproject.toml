[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-triage-demo"
version = "0.1.0"
description = "Educational text-classification API and observability stack"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "joblib>=1.4,<2",
    "numpy>=1.26,<3",
    "onnxruntime>=1.20,<2",
    "prometheus-client>=0.21,<1",
    "scikit-learn>=1.5,<2",
    "skl2onnx>=1.17,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["triage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
